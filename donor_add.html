{% extends 'base.html' %}

{% block title %}
Add Donor | LifeFlow
{% endblock %}


{% block extra_css %}

<style>

    .donor-wrapper {
        max-width: 750px;
        margin: 40px auto;
    }

    .donor-card {
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    .donor-header {
        text-align: center;
        margin-bottom: 30px;
    }

    .donor-icon {
        width: 75px;
        height: 75px;
        background: #ffe5e5;
        color: #cc0000;
        border-radius: 50%;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 32px;
        margin: 0 auto 15px;
    }

    .donor-header h2 {
        color: #b30000;
        font-weight: 700;
    }

    .form-label {
        font-weight: 600;
    }

</style>

{% endblock %}


{% block content %}

<div class="donor-wrapper">

    <div class="donor-card">


        <!-- HEADER -->

        <div class="donor-header">

            <div class="donor-icon">

                <i class="fa-solid fa-user-plus"></i>

            </div>

            <h2>Add Blood Donor</h2>

            <p class="text-muted">
                Enter the donor details below.
            </p>

        </div>


        <!-- FORM -->

        <form method="POST">

            {% csrf_token %}


            <!-- NAME -->

            <div class="mb-3">

                <label class="form-label">

                    Full Name

                </label>

                <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Enter donor name"
                    required
                >

            </div>


            <div class="row">


                <!-- AGE -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Age

                    </label>

                    <input
                        type="number"
                        name="age"
                        class="form-control"
                        min="18"
                        max="65"
                        placeholder="Enter age"
                        required
                    >

                </div>


                <!-- BLOOD GROUP -->

                <div class="col-md-6 mb-3">

                    <label class="form-label">

                        Blood Group

                    </label>

                    <select
                        name="blood_group"
                        class="form-select"
                        required
                    >

                        <option value="">
                            Select Blood Group
                        </option>

                        <option value="A+">A+</option>
                        <option value="A-">A-</option>

                        <option value="B+">B+</option>
                        <option value="B-">B-</option>

                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>

                        <option value="O+">O+</option>
                        <option value="O-">O-</option>

                    </select>

                </div>

            </div>


            <!-- PHONE -->

            <div class="mb-3">

                <label class="form-label">

                    Phone Number

                </label>

                <input
                    type="tel"
                    name="phone"
                    class="form-control"
                    placeholder="Enter phone number"
                    required
                >

            </div>


            <!-- ADDRESS -->

            <div class="mb-3">

                <label class="form-label">

                    Address

                </label>

                <textarea
                    name="address"
                    class="form-control"
                    rows="3"
                    placeholder="Enter donor address"
                    required
                ></textarea>

            </div>


            <!-- LAST DONATION DATE -->

            <div class="mb-4">

                <label class="form-label">

                    Last Donation Date
                    <span class="text-muted">(Optional)</span>

                </label>

                <input
                    type="date"
                    name="last_donation_date"
                    class="form-control"
                >

            </div>


            <!-- BUTTONS -->

            <div class="row g-3">

                <div class="col-md-6">

                    <a href="{% url 'donor_list' %}"
                       class="btn btn-outline-secondary w-100">

                        Cancel

                    </a>

                </div>


                <div class="col-md-6">

                    <button
                        type="submit"
                        class="btn btn-blood w-100"
                    >

                        <i class="fa-solid fa-user-plus"></i>

                        Add Donor

                    </button>

                </div>

            </div>

        </form>

    </div>

</div>

{% endblock %}
